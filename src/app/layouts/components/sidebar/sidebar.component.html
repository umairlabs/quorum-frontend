@if (layoutService.isMobileMenuOpen()) {
  <div
    (click)="layoutService.closeMobileMenu()"
    class="md:hidden fixed inset-0 bg-black/50 z-40"
  ></div>
}

<nav
  [class.-translate-x-full]="!layoutService.isMobileMenuOpen()"
  class="flex md:translate-x-0 flex-col h-full py-gutter px-unit bg-surface border-r border-outline-variant fixed left-0 top-0 w-[260px] z-50 transition-transform duration-200 ease-in-out"
>

  <div class="px-3 mb-8 flex items-center gap-3">
    <div class="w-8 h-8 rounded bg-primary flex items-center justify-center text-on-primary">
      <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
    </div>
    <div class="min-w-0 flex-1">
      <h1 class="font-headline-sm text-headline-sm font-bold text-primary leading-tight">AssetFlow</h1>
      <p class="font-label-sm text-label-sm text-on-surface-variant truncate" [title]="userDisplayName()">
        {{ userDisplayName() }}
      </p>
    </div>
  </div>

  <div class="flex-1 space-y-0.5">
  @for (item of navItems(); track item.route) {
      <a
        [routerLink]="item.route"
        (click)="onNavItemClick(item)"
        routerLinkActive="text-primary font-bold border-r-4 border-primary bg-secondary-container/50"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer"
      >
        <span class="material-symbols-outlined">{{ item.icon }}</span>
        <span class="font-label-md text-label-md">{{ item.label }}</span>
      </a>
    }
  </div>

  <div class="mt-auto pt-4 pb-4 border-t border-outline-variant">
    <button
      (click)="onLogout()"
      type="button"
      class="flex w-full items-center gap-3 px-3 py-2.5 rounded-lg text-error hover:bg-error-container/20 border border-transparent hover:border-error/20 transition-colors font-label-md text-label-md font-medium cursor-pointer"
      title="Sign out of your account"
    >
      <span class="material-symbols-outlined text-[20px]">logout</span>
      <span>Logout</span>
    </button>
  </div>

</nav>

<app-confirm-dialog
  [isOpen]="isLogoutModalOpen()"
  title="Log Out of Your Account?"
  message="Are you sure you want to log out of your account? You will need to sign in again to access AssetFlow."
  confirmLabel="Log Out"
  cancelLabel="Cancel"
  icon="logout"
  [dangerous]="true"
  (confirm)="onConfirmLogout()"
  (cancel)="onCancelLogout()"
/>
