@if (isOpen()) {
  <div
    class="confirm-backdrop fixed inset-0 z-50 flex items-center justify-center bg-scrim/50 p-4"
    (click)="onBackdropClick($event)"
  >
    <div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-xl w-full max-w-sm p-6 flex flex-col gap-5">

      <!-- Icon + Title -->
      <div class="flex items-start gap-4">
        @if (icon()) {
          <div class="w-10 h-10 rounded-full bg-error-container/40 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-error text-[22px]">{{ icon() }}</span>
          </div>
        } @else if (dangerous()) {
          <div class="w-10 h-10 rounded-full bg-error-container/40 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-error text-[22px]">delete_forever</span>
          </div>
        } @else {
          <div class="w-10 h-10 rounded-full bg-secondary-container/40 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-primary text-[22px]">info</span>
          </div>
        }
        <div>
          <h3 class="font-headline-sm text-headline-sm text-on-surface">{{ title() }}</h3>
          <p class="font-body-md text-body-md text-on-surface-variant mt-1">{{ message() }}</p>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3">
        <button
          (click)="onCancel()"
          class="h-9 px-5 rounded-lg border border-outline-variant font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors"
        >
          {{ cancelLabel() }}
        </button>
        <button
          (click)="onConfirm()"
          [class]="dangerous()
            ? 'h-9 px-5 rounded-lg bg-error text-on-error font-label-md text-label-md hover:bg-error/90 transition-colors shadow-sm'
            : 'h-9 px-5 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary/90 transition-colors shadow-sm'"
        >
          {{ confirmLabel() }}
        </button>
      </div>

    </div>
  </div>
}
