<div class="relative" (click)="$event.stopPropagation()">
  <div class="flex items-center border border-outline-variant rounded-lg bg-surface-container-lowest h-[40px] overflow-hidden focus-within:ring-2 focus-within:ring-primary focus-within:ring-offset-1">

    <!-- Country selector button -->
    <button
      type="button"
      (click)="toggleDropdown($event)"
      class="flex items-center gap-1.5 px-3 h-full border-r border-outline-variant hover:bg-surface-container-low transition-colors shrink-0"
    >
  <img [src]="'https://flagcdn.com/w40/' + selectedCountry().iso.toLowerCase() + '.png'"
     [alt]="selectedCountry().name"
     class="w-5 h-4 object-cover rounded-[3px] shrink-0" />
      <span class="font-body-sm text-body-sm text-on-surface">+{{ selectedCountry().dialCode }}</span>
      <span class="material-symbols-outlined text-[16px] text-on-surface-variant">expand_more</span>
    </button>

    <!-- Local number input -->
    <input
      type="tel"
      [value]="localNumber()"
      (input)="onNumberInput($event)"
      [placeholder]="'e.g. ' + ('3001234567' | slice:0:selectedCountry().digits)"
   [attr.maxlength]="selectedCountry().digits"
      class="flex-1 h-full px-3 font-body-md text-body-md bg-transparent text-on-surface focus:outline-none placeholder:text-on-surface-variant/50"
    />
  </div>

  <!-- Dropdown -->
  @if (dropdownOpen()) {
  <div
    class="absolute left-0 top-full mt-1 w-72 bg-surface-container-lowest border border-outline-variant rounded-lg shadow-xl z-50 overflow-hidden"
    (click)="$event.stopPropagation()"
  >
    <div class="p-2 border-b border-outline-variant">
      <input
        type="text"
        [value]="searchTerm()"
        (input)="onSearchChange($event.target.value)"
        placeholder="Search country or code..."
        class="w-full h-9 px-3 font-body-sm text-body-sm bg-surface-container-low rounded border border-outline-variant focus:outline-none focus:ring-2 focus:ring-primary"
      />
    </div>
    <div class="max-h-56 overflow-y-auto">
      @for (country of filteredCountries; track country.iso) {
      <button
        type="button"
        (click)="selectCountry(country, $event)"
        class="w-full flex items-center justify-between px-3 py-2 hover:bg-surface-container-low transition-colors text-left"
      >
        <span class="flex items-center gap-2">
       <img [src]="'https://flagcdn.com/w40/' + country.iso.toLowerCase() + '.png'"
     [alt]="country.name"
     class="w-5 h-4 object-cover rounded-[3px] shrink-0" />
          <span class="font-body-sm text-body-sm text-on-surface">{{ country.name }}</span>
        </span>
        <span class="font-body-sm text-body-sm text-on-surface-variant">+{{ country.dialCode }}</span>
      </button>
      } @empty {
      <div class="p-3 text-center text-body-sm text-on-surface-variant">No country found.</div>
      }
    </div>
  </div>
  }
</div>
