@switch (variant()) {
  @case ('input-addon') {
    <div class="relative inline-flex items-center shrink-0">
      <button
        type="button"
        (click)="toggleDropdown($event)"
        class="h-[40px] px-3 rounded-l-lg bg-surface-container-low border-r border-outline-variant text-on-surface font-label-sm text-[13px] font-semibold flex items-center gap-1.5 cursor-pointer hover:bg-surface-container-high transition-colors focus:outline-none select-none"
      >
        <span>{{ currencyService.activeCurrency() }}</span>
        <span
          [class.rotate-180]="isOpen()"
          class="material-symbols-outlined text-[16px] text-on-surface-variant transition-transform duration-200 shrink-0"
        >
          expand_more
        </span>
      </button>

      @if (isOpen()) {
        <div
          class="absolute left-0 top-full mt-1 min-w-[130px] bg-white rounded-xl border border-slate-300 shadow-xl z-50 py-1 max-h-60 overflow-y-auto hide-scrollbar animate-in fade-in-50 zoom-in-95 duration-100"
        >
          @for (c of currencies; track c.code) {
            <button
              type="button"
              (click)="onSelect(c.code)"
              [class]="currencyService.activeCurrency() === c.code
                ? 'bg-black text-white font-semibold'
                : 'text-slate-800 hover:bg-slate-100 hover:text-black font-normal'"
              class="w-full px-3 py-2 text-left text-body-sm font-body-sm flex items-center justify-between gap-2 transition-colors cursor-pointer"
            >
              <div class="flex items-center gap-1.5 truncate">
                <span class="truncate font-semibold">{{ c.code }}</span>
                <span [class]="currencyService.activeCurrency() === c.code ? 'text-white/70' : 'text-slate-500'" class="text-[11px]">({{ c.symbol.trim() }})</span>
              </div>
              @if (currencyService.activeCurrency() === c.code) {
                <span class="material-symbols-outlined text-[16px] text-white shrink-0">check</span>
              }
            </button>
          }
        </div>
      }
    </div>
  }

  @case ('pill') {
    <div class="relative inline-block">
      <button
        type="button"
        (click)="toggleDropdown($event)"
        class="h-8 px-2.5 rounded-full bg-surface-container-low hover:bg-surface-container-high border border-outline-variant text-on-surface font-label-sm text-[12px] font-medium flex items-center gap-1.5 transition-colors cursor-pointer select-none"
        title="Change currency">
        <span class="font-semibold text-primary">{{ currencyService.currentConfig().code }}</span>
        <span class="text-on-surface-variant text-[11px]">({{ currencyService.currentConfig().symbol.trim() }})</span>
        <span class="material-symbols-outlined text-[14px] text-on-surface-variant transition-transform duration-200" [class.rotate-180]="isOpen()">
          expand_more
        </span>
      </button>

      @if (isOpen()) {
        <div class="absolute right-0 mt-1.5 w-48 bg-white rounded-xl shadow-xl border border-slate-300 py-1 z-50 max-h-60 overflow-y-auto hide-scrollbar animate-in fade-in-50 zoom-in-95 duration-100">
          @for (c of currencies; track c.code) {
            <button
              type="button"
              (click)="onSelect(c.code)"
              [class]="currencyService.activeCurrency() === c.code
                ? 'bg-black text-white font-semibold'
                : 'text-slate-800 hover:bg-slate-100 hover:text-black font-normal'"
              class="w-full px-3 py-2 text-left flex items-center justify-between transition-colors cursor-pointer text-body-sm font-body-sm"
            >
              <div class="flex items-center gap-2">
                <span class="font-semibold">{{ c.code }}</span>
                <span [class]="currencyService.activeCurrency() === c.code ? 'text-white/70' : 'text-slate-500'" class="text-[11px]">({{ c.symbol.trim() }})</span>
              </div>
              @if (currencyService.activeCurrency() === c.code) {
                <span class="material-symbols-outlined text-[16px] text-white shrink-0">check</span>
              }
            </button>
          }
        </div>
      }
    </div>
  }

  @case ('dropdown') {
    <div class="relative inline-block w-full">
      <button
        type="button"
        (click)="toggleDropdown($event)"
        class="w-full h-[40px] px-3 bg-surface-container-lowest border border-outline-variant rounded-lg text-on-surface font-body-md text-body-md flex items-center justify-between gap-2 hover:border-slate-400 transition-colors focus:outline-none cursor-pointer select-none"
      >
        <span class="font-semibold text-on-surface">
          {{ currencyService.activeCurrency() }} — {{ currencyService.currentConfig().name }} ({{ currencyService.currentConfig().symbol.trim() }})
        </span>
        <span
          [class.rotate-180]="isOpen()"
          class="material-symbols-outlined text-[18px] text-on-surface-variant transition-transform duration-200 shrink-0"
        >
          expand_more
        </span>
      </button>

      @if (isOpen()) {
        <div
          class="absolute left-0 right-0 top-full mt-1.5 py-1 bg-white rounded-xl border border-slate-300 shadow-xl z-50 max-h-60 overflow-y-auto hide-scrollbar animate-in fade-in-50 zoom-in-95 duration-100"
        >
          @for (c of currencies; track c.code) {
            <button
              type="button"
              (click)="onSelect(c.code)"
              [class]="currencyService.activeCurrency() === c.code
                ? 'bg-black text-white font-semibold'
                : 'text-slate-800 hover:bg-slate-100 hover:text-black font-normal'"
              class="w-full px-3.5 py-2 text-left text-body-sm font-body-sm flex items-center justify-between gap-2 transition-colors cursor-pointer"
            >
              <div class="flex items-center gap-2 truncate">
                <span class="truncate font-semibold">{{ c.code }} — {{ c.name }} ({{ c.symbol.trim() }})</span>
              </div>
              @if (currencyService.activeCurrency() === c.code) {
                <span class="material-symbols-outlined text-[16px] text-white shrink-0">check</span>
              }
            </button>
          }
        </div>
      }
    </div>
  }
}
