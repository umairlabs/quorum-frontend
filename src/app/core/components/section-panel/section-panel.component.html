<div class="bg-surface-container-lowest border border-outline-variant rounded-lg flex flex-col h-full">

  <!-- Header -->
  <div class="p-4 border-b border-outline-variant flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
    <h3 class="font-headline-sm text-headline-sm text-on-surface">{{ title() }}</h3>
    @if (actionLabel()) {
      <button
        class="font-label-sm text-label-sm text-primary hover:underline cursor-pointer"
        (click)="onActionClick()"
      >
        {{ actionLabel() }}
      </button>
    }
    <!-- Slot for custom header actions (e.g. select dropdown) -->
    <ng-content select="[panelAction]" />
  </div>

  <!-- Body -->
  <div class="flex-1 flex flex-col">
    <ng-content />
  </div>

</div>
