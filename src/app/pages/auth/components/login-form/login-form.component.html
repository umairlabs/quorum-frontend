<!-- Header -->
<div class="mb-[24px]">
  <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight mb-2">Welcome back!</h1>
  <p class="text-sm text-gray-500">Please enter your details.</p>
</div>

<!-- Server Error Alert -->
@if (serverError()) {
  <div class="mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs font-medium flex items-center gap-2">
    <span class="material-symbols-outlined text-[18px]">error</span>
    <span>{{ serverError() }}</span>
  </div>
}

<!-- Success Message Alert -->
@if (successMessage()) {
  <div class="mb-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium flex items-center gap-2">
    <span class="material-symbols-outlined text-[18px]">check_circle</span>
    <span>{{ successMessage() }}</span>
  </div>
}

<!-- Form -->
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
  <!-- Email Input -->
  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-gray-700 tracking-wide" for="email">Email</label>
    <div class="relative">
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Enter your email"
        (focus)="onEmailFocus()"
        (blur)="onEmailBlur()"
        class="w-full px-4 py-2.5 bg-gray-50/50 hover:bg-gray-50 focus:bg-white border border-gray-200 rounded-xl text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition-all shadow-sm"
        [class.border-red-500]="shouldShowEmailError()"
      />
    </div>
    @if (shouldShowEmailError()) {
      <div class="text-red-500 text-xs mt-0.5">
        Enter a valid email
      </div>
    }
  </div>

  <!-- Password Input -->
  <div class="flex flex-col gap-1.5">
    <label class="text-xs font-semibold text-gray-700 tracking-wide" for="password">Password</label>
    <div class="relative">
      <input
        id="password"
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        placeholder="••••••••••••"
        (focus)="onPasswordFocus()"
        (blur)="onPasswordBlur()"
        class="w-full pl-4 pr-11 py-2.5 bg-gray-50/50 hover:bg-gray-50 focus:bg-white border border-gray-200 rounded-xl text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent transition-all shadow-sm"
        [class.border-red-500]="shouldShowPasswordError()"
      />
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1 rounded-lg transition-colors focus:outline-none"
      >
        <span class="material-symbols-outlined text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
      </button>
    </div>
    @if (shouldShowPasswordError()) {
      <div class="text-red-500 text-xs mt-0.5">
        Enter correct password
      </div>
    }
  </div>

  <!-- Submit Button -->
  <button
    type="submit"
    [disabled]="isLoading()"
    class="mt-2 w-full h-11 bg-gray-900 text-white rounded-xl font-medium text-sm flex items-center justify-center gap-2 hover:bg-gray-800 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 transition-all shadow-sm disabled:opacity-75 disabled:cursor-not-allowed"
  >
    @if (isLoading()) {
      <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
      <span>Signing in...</span>
    } @else {
      <span>Log In</span>
    }
  </button>
</form>
