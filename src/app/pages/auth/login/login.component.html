<div class="w-full max-w-[1020px] bg-white rounded-[32px] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.07)] border border-gray-100 overflow-hidden flex flex-col md:flex-row mx-auto">
  <!-- Left Side: Interactive SVG Characters Stage -->
  <div class="w-full md:w-[54%] bg-[#f8fafc] flex flex-col items-center justify-center p-8 sm:p-12 relative overflow-hidden border-b md:border-b-0 md:border-r border-gray-100/90">
    <div class="w-full max-w-[460px] relative z-10 flex flex-col items-center justify-center">
      <app-login-characters
        [focusField]="focusField()"
        [showPassword]="showPassword()"
        [cursorX]="cursorX()"
        [cursorY]="cursorY()"
        [textLength]="textLength()"
        [isError]="serverError() !== null"
      />
    </div>
  </div>

  <!-- Right Side: Clean Modern Form -->
  <div class="w-full md:w-[46%] bg-white p-8 sm:p-12 md:p-14 flex flex-col justify-center">
    <div class="w-full max-w-[360px] mx-auto">
      <app-login-form
        [isLoading]="isLoading()"
        [serverError]="serverError()"
        [successMessage]="successMessage()"
        (formSubmit)="onSubmit($event)"
        (focusChange)="onFocusChange($event)"
        (showPasswordChange)="onShowPasswordChange($event)"
        (textLengthChange)="onTextLengthChange($event)"
      />
    </div>
  </div>
</div>
