<div class="grid grid-cols-2 sm:grid-cols-4 gap-4">

  <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Total</p>
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">build_circle</span>
    </div>
    <p class="font-headline-md text-headline-md text-on-surface font-bold">{{ stats().total }}</p>
  </div>

  <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Pending</p>
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">schedule</span>
    </div>
    <p class="font-headline-md text-headline-md text-on-surface font-bold">{{ stats().pending }}</p>
  </div>

  <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">In Progress</p>
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">autorenew</span>
    </div>
    <p class="font-headline-md text-headline-md text-on-surface font-bold">{{ stats().inProgress }}</p>
  </div>

  <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Completed</p>
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">check_circle</span>
    </div>
    <p class="font-headline-md text-headline-md text-on-surface font-bold">{{ stats().completed }}</p>
  </div>

</div>
