<div class="max-w-[1440px] mx-auto p-gutter sm:p-container-padding py-8">

  <div class="mb-8">
    <app-page-header [title]="isPurchasedAsset ? 'Edit Purchased Asset' : 'Edit Inventory Asset'" [subtitle]="isPurchasedAsset
        ? 'Update identification, status, supplier, and financial details for this asset.'
        : 'Update name, category, brand, model, and color for this inventory asset.'" />
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">

    <!-- Section 1: Identification — shown for ALL assets -->
    <app-form-section title="Identification & Basic Info" icon="badge">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">

        <!-- Name -->
        <div class="md:col-span-2">
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_name">
            Asset Name <span class="text-error">*</span>
          </label>
          <input id="edit_name" type="text" formControlName="name" placeholder="e.g. Dell Latitude 7420, Infinix Hot 40"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" />
        </div>

        <!-- Category -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_category">
            Category <span class="text-error">*</span>
          </label>
          <app-select
            [options]="categoryOptions()"
            [value]="form.get('category')?.value || ''"
            placeholder="Select category..."
            (selectionChange)="onCategorySelect($event)" />
        </div>

        <!-- Brand -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_brand">
            Brand
          </label>
          <input id="edit_brand" type="text" formControlName="brand" placeholder="e.g. Dell, Apple, Infinix"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" />
        </div>

        <!-- Model -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_model">
            Model
          </label>
          <input id="edit_model" type="text" formControlName="model" placeholder="e.g. Latitude 7420, Hot 40"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" />
        </div>

        <!-- Color -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_color">
            Color
          </label>
          <input id="edit_color" type="text" formControlName="color" placeholder="e.g. Silver, Black, Space Gray"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" />
        </div>

      </div>
    </app-form-section>

    <!-- Section 2: Financial & Status — purchased assets only -->
    @if (isPurchasedAsset) {
    <app-form-section title="Financial & Purchase Info" icon="payments">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5">

        <!-- Serial Number (read-only) -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_serial">
            Serial Number
          </label>
          <input id="edit_serial" type="text" formControlName="serialNumber"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-low text-on-surface-variant border border-outline-variant rounded-lg font-mono cursor-not-allowed" />
          <p class="text-on-surface-variant text-body-sm mt-1">Cannot be changed after creation</p>
        </div>

        <!-- Status -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_status">
            Status <span class="text-error">*</span>
          </label>
          <app-select
            [options]="statusOptions"
            [value]="form.get('status')?.value || 'AVAILABLE'"
            placeholder="Select status..."
            (selectionChange)="onStatusSelect($event)" />
        </div>

        <!-- Assigned To -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_assigned">
            Assigned To
          </label>
          <input id="edit_assigned" type="text" formControlName="assignedTo" placeholder="e.g. Ahmed Ali"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" />
        </div>

        <!-- Supplier -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5" for="edit_supplier">
            Supplier
          </label>
          <input id="edit_supplier" type="text" formControlName="supplier" placeholder="e.g. TechCorp Solutions"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" />
        </div>

        <!-- Purchase Date -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5"
            for="edit_purchase_date">
            Purchase Date
          </label>
          <input id="edit_purchase_date" type="date" formControlName="purchaseDate" min="1900-01-01" max="9999-12-31"
            class="w-full h-[40px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow" />
        </div>

        <!-- Purchase Cost -->
        <div>
          <label class="block font-label-sm text-label-sm text-on-surface font-semibold mb-1.5"
            for="edit_purchase_cost">
            Purchase Price
          </label>
          <div class="flex rounded-lg border border-outline-variant bg-surface-container-lowest focus-within:ring-2 focus-within:ring-primary focus-within:border-primary relative transition-shadow">
            <app-currency-selector variant="input-addon" (currencyChange)="onCurrencyChange($event)" />
            <input id="edit_purchase_cost" type="number" step="0.01" min="0" formControlName="purchaseCost"
              placeholder="0.00"
              class="flex-1 h-[40px] px-3 font-body-md text-body-md bg-transparent text-on-surface focus:outline-none placeholder:text-on-surface-variant/50 rounded-r-lg" />
          </div>
        </div>

      </div>
    </app-form-section>

    <!-- Section 3: Technical Specifications — purchased assets only -->
    <app-form-section title="Technical Specifications" icon="memory">
      <div formArrayName="techSpecs" class="space-y-4">
        <div class="flex items-center justify-between">
          <label class="block font-label-md text-label-md text-on-surface font-semibold">
            Specifications <span class="font-normal text-on-surface-variant">(Optional)</span>
          </label>
          <button type="button" (click)="addSpec()"
            class="h-9 px-3 rounded-md border border-dashed border-primary text-primary font-label-sm text-label-sm hover:bg-primary/5 transition-colors flex items-center gap-2">
            <span class="material-symbols-outlined text-[16px]">add</span>
            Add Specification
          </button>
        </div>

        @for (specGroup of techSpecsArray.controls; track $index) {
        <div [formGroupName]="$index"
          class="grid grid-cols-1 sm:grid-cols-2 gap-4 p-4 bg-surface-container-low rounded-lg border border-outline-variant/60">
          <div>
            <label class="block font-label-sm text-body-sm text-on-surface-variant mb-1 font-medium">Key / Label</label>
            <input type="text" formControlName="key" placeholder="e.g. RAM, Processor, Storage"
              class="w-full h-[42px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow placeholder:text-on-surface-variant/50" />
          </div>
          <div>
            <label class="block font-label-sm text-body-sm text-on-surface-variant mb-1 font-medium">Value</label>
            <div class="flex items-center gap-2">
              <input type="text" formControlName="value" placeholder="e.g. 16GB, Intel i7, 512GB SSD"
                class="w-full h-[42px] px-3 font-body-md text-body-md bg-surface-container-lowest text-on-surface border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-1 transition-shadow placeholder:text-on-surface-variant/50" />
              <button type="button" (click)="removeSpec($index)"
                class="p-2 rounded-md hover:bg-error-container/40 text-error shrink-0" title="Remove">
                <span class="material-symbols-outlined text-[20px]">delete</span>
              </button>
            </div>
          </div>
        </div>
        }

        @if (techSpecsArray.length === 0) {
        <div class="p-4 border-2 border-dashed border-outline-variant rounded-lg text-center">
          <p class="text-body-sm text-on-surface-variant">No specifications added yet. Click "Add Specification" to add
            technical details.</p>
        </div>
        }
      </div>
    </app-form-section>
    }

    <!-- Form Actions -->
    <div class="flex items-center justify-end gap-4 pt-4">
      <button type="button" (click)="onCancel()"
        class="h-[40px] px-6 rounded-lg border border-outline-variant font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-all">
        Cancel
      </button>
      <button type="submit" [disabled]="form.invalid"
        class="h-[40px] px-6 rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary/90 transition-all shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        Save Changes
      </button>
    </div>

  </form>
</div>
