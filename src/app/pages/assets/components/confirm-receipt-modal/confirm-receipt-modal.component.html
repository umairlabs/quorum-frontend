@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-fade-in">
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-2xl max-w-md w-full p-6 space-y-5" (click)="$event.stopPropagation()">
      <div class="flex items-center justify-between border-b border-outline-variant/50 pb-3">
        <h3 class="text-title-lg font-title-lg text-on-surface flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">verified</span>
          Confirm Asset Receipt
        </h3>
        <button (click)="onCancel()" class="p-1 rounded-lg text-on-surface-variant hover:bg-surface-variant/50 transition-colors">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="space-y-3">
        <div class="bg-surface-container-low p-3 rounded-lg border border-outline-variant/30">
          <p class="text-body-sm text-on-surface-variant">Asset Name:</p>
          <p class="text-body-md font-semibold text-on-surface">{{ assetName() }}</p>
          <p class="text-body-sm text-on-surface-variant mt-1">Serial Number:</p>
          <p class="text-body-md font-mono text-primary">{{ serialNumber() || 'N/A' }}</p>
        </div>

        <div>
          <label class="block text-label-md font-label-md text-on-surface mb-2">Condition at Receipt:</label>
          <div class="space-y-2">
            <label class="flex items-center gap-3 p-2.5 rounded-lg border border-outline-variant/60 hover:bg-surface-container-low cursor-pointer transition-colors">
              <input type="radio" name="condition" value="Good Condition" [ngModel]="selectedCondition()" (ngModelChange)="selectedCondition.set($event)" class="text-primary focus:ring-primary">
              <span class="text-body-md text-on-surface font-medium">Good Condition</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 rounded-lg border border-outline-variant/60 hover:bg-surface-container-low cursor-pointer transition-colors">
              <input type="radio" name="condition" value="Damaged" [ngModel]="selectedCondition()" (ngModelChange)="selectedCondition.set($event)" class="text-primary focus:ring-primary">
              <span class="text-body-md text-error font-medium">Damaged</span>
            </label>
            <label class="flex items-center gap-3 p-2.5 rounded-lg border border-outline-variant/60 hover:bg-surface-container-low cursor-pointer transition-colors">
              <input type="radio" name="condition" value="Missing Accessories" [ngModel]="selectedCondition()" (ngModelChange)="selectedCondition.set($event)" class="text-primary focus:ring-primary">
              <span class="text-body-md text-warning font-medium">Missing Accessories</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-label-md font-label-md text-on-surface mb-1">Additional Notes (Optional):</label>
          <textarea
            [ngModel]="notes()"
            (ngModelChange)="notes.set($event)"
            rows="3"
            placeholder="Provide any comments or defect details..."
            class="w-full rounded-lg border border-outline-variant bg-surface p-3 text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none"></textarea>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 pt-3 border-t border-outline-variant/50">
        <button
          type="button"
          (click)="onCancel()"
          class="h-9 px-4 rounded-lg font-label-md text-label-md border border-outline-variant text-on-surface hover:bg-surface-container-low transition-colors">
          Cancel
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="h-9 px-4 rounded-lg font-label-md text-label-md bg-primary text-on-primary hover:bg-primary/90 transition-colors flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
          Confirm Received
        </button>
      </div>
    </div>
  </div>
}
